name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh

  deploy:
    name: Deploy production after CI
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [shell, test, frontend, golangci-lint, release-helpers]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether production source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then before_sha="$(git rev-parse "$TARGET_SHA^" 2>/dev/null || true)"; fi
          if [[ -z "$before_sha" ]]; then changed_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA")"; else changed_files="$(git diff --name-only "$before_sha" "$TARGET_SHA")"; fi
          if grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
      - name: Queue signed deployment and wait for the server
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ steps.scope.outputs.before_sha }}
          TARGET_SHA: ${{ github.sha }}
          DELIVERY_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto'
          const secret = process.env.DEPLOY_SECRET
          if (!secret || secret.length < 32) throw new Error('deployment secret is not configured')
          const payload = { repository: { full_name: process.env.REPOSITORY }, ref: process.env.REF, before: process.env.BEFORE_SHA, after: process.env.TARGET_SHA }
          const body = JSON.stringify(payload)
          const signature = 'sha256=' + createHmac('sha256', secret).update(body).digest('hex')
          const accepted = await fetch('https://ad.gaoseafood.com/api/deploy-hook/sub2api', { method: 'POST', headers: { 'content-type': 'application/json', 'x-github-event': 'push', 'x-github-delivery': process.env.DELIVERY_ID, 'x-hub-signature-256': signature }, body })
          const receipt = await accepted.json()
          if (!accepted.ok || receipt.queued !== true) throw new Error('server did not queue the deployment')
          const statusUrl = new URL('https://ad.gaoseafood.com/api/deploy-hook/sub2api/status')
          statusUrl.searchParams.set('sha', process.env.TARGET_SHA)
          for (let attempt = 0; attempt < 360; attempt++) {
            const response = await fetch(statusUrl, { headers: { 'x-deploy-token': secret } })
            const state = await response.json()
            if (!response.ok) throw new Error('server deployment status could not be read')
            if (state.status === 'succeeded') { console.log('Production deployment succeeded for ' + state.sha); process.exit(0) }
            if (state.status === 'failed') throw new Error('Production deployment failed: ' + (state.message || 'see server deployment logs'))
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw new Error('Timed out waiting for the server deployment')
          NODE
