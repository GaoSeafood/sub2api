name: Sync upstream

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      UPSTREAM_REPOSITORY: "Wei-Shaw/sub2api"
      UPSTREAM_BRANCH: "main"
      FORK_BRANCH: "main"
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "main"
          fetch-depth: 0

      - name: Compare with upstream and prepare a review branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet origin --prune
          git fetch --quiet upstream "$UPSTREAM_BRANCH" --no-tags
          count="$(git rev-list --count "origin/$FORK_BRANCH..upstream/$UPSTREAM_BRANCH")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [[ "$count" != 0 ]] || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "origin/$FORK_BRANCH"
          git switch --create automation/upstream-sync

          if git show-ref --verify --quiet refs/remotes/origin/automation/upstream-sync; then
            merge_log="$RUNNER_TEMP/previous-sync-merge.log"
            if ! git merge --no-edit --no-ff origin/automation/upstream-sync >"$merge_log" 2>&1; then
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              cat "$merge_log"
              if [[ -n "$conflicts" ]]; then
                printf 'Previous sync branch conflicts with the fork main branch. Resolve these files and rerun:\n%s\n' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              git merge --abort || true
              exit 1
            fi
          fi

          merge_log="$RUNNER_TEMP/upstream-merge.log"
          if ! git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH" >"$merge_log" 2>&1; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            non_config_conflicts="$(grep -Ev '^[.]github/' <<<"$conflicts" || true)"
            if [[ -z "$conflicts" || -n "$non_config_conflicts" ]]; then
              cat "$merge_log"
              if [[ -n "$conflicts" ]]; then
                printf 'Upstream merge conflicts require manual resolution:\n%s\n' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              git merge --abort || true
              exit 1
            fi
            # Keep this fork's GitHub configuration when upstream changed the same paths.
            git restore --source="origin/$FORK_BRANCH" --staged --worktree -- .github
            git commit --no-edit
          fi

          # Upstream Actions files are fork-specific configuration and stay out of the sync PR.
          git restore --source="origin/$FORK_BRANCH" --staged --worktree -- .github
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if git diff --quiet "origin/$FORK_BRANCH" HEAD; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:refs/heads/automation/upstream-sync

      - name: Open or refresh the review PR
        if: steps.sync.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          This PR syncs $UPSTREAM_REPOSITORY into this fork.
          Fork-specific GitHub automation and deployment files are preserved; conflicts outside that configuration stop the workflow for manual resolution. Upstream application changes are reviewed here. Automatic merge waits for every check and pauses for deployment, environment, or schema migration changes.
          EOF
          pr_number="$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base="$FORK_BRANCH" -f head="$GH_OWNER:automation/upstream-sync" --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "chore: sync upstream" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --repo "$GH_REPO" --base "$FORK_BRANCH" --head "$GH_OWNER:automation/upstream-sync" --title "chore: sync upstream" --body-file "$RUNNER_TEMP/pr-body.md"
            pr_number="$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base="$FORK_BRANCH" -f head="$GH_OWNER:automation/upstream-sync" --jq '.[0].number // empty')"
          fi
          [[ -n "$pr_number" ]] || { echo "Could not identify the upstream sync PR."; exit 1; }

          # GITHUB_TOKEN does not reliably emit follow-up PR events; dispatch the checks and gate explicitly.
          gh workflow run backend-ci.yml --repo "$GH_REPO" --ref automation/upstream-sync
          gh workflow run security-scan.yml --repo "$GH_REPO" --ref automation/upstream-sync
          gh workflow run auto-merge.yml --repo "$GH_REPO" --ref "$FORK_BRANCH" -f pr_number="$pr_number"
